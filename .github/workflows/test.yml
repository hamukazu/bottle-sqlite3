name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["310", "311", "312", "313", "314"]
        bottle: ["bottle012", "bottle013"]
        exclude:
          # tox.ini: py314-bottle013 only
          - python-version: "314"
            bottle: "bottle012"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: python -m pip install tox

      - name: Run tox
        env:
          TOXENV: py${{ matrix.python-version }}-${{ matrix.bottle }}
        run: tox
