[project]
name = "bottle-sqlite3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kimikazu Kato", email = "kimikazu@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bottle>=0.13.4",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "tox>=4.65.0",
]

[tool.pytest.ini_options]
python_files = ["test.py", "test_*.py", "*_test.py"]
